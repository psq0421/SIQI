<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">SIQI local-first architecture</title>
  <desc id="desc">A diagram showing the SIQI Android app, local storage and native runtimes, with optional network services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#315efb"/><stop offset="1" stop-color="#7b5cff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#21335f" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7ca8"/></marker>
  </defs>
  <rect width="1200" height="620" rx="30" fill="url(#bg)"/>
  <text x="70" y="74" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#17203b">司器 SIQI · local-first AI workstation</text>
  <text x="70" y="108" font-family="Inter,Arial,sans-serif" font-size="18" fill="#5e6c8d">Data, sessions and model metadata stay on the device by default.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="160" width="310" height="350" rx="28" fill="url(#brand)"/>
    <text x="105" y="220" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="white">Android app</text>
    <text x="105" y="266" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e9edff">Chat · Agent · Harness</text>
    <text x="105" y="300" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e9edff">MCP · AI team · LAN gateway</text>
    <rect x="105" y="348" width="240" height="112" rx="18" fill="#ffffff" fill-opacity=".16"/>
    <text x="126" y="384" font-family="Inter,Arial,sans-serif" font-size="17" fill="white">Material 3 UI</text>
    <text x="126" y="414" font-family="Inter,Arial,sans-serif" font-size="17" fill="white">Four-language l10n</text>
    <text x="126" y="444" font-family="Inter,Arial,sans-serif" font-size="17" fill="white">Scoped Storage aware</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="470" y="160" width="310" height="350" rx="28" fill="white"/>
    <text x="505" y="220" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#17203b">On-device core</text>
    <text x="505" y="268" font-family="Inter,Arial,sans-serif" font-size="18" fill="#415170">SQLite + encrypted keys</text>
    <text x="505" y="302" font-family="Inter,Arial,sans-serif" font-size="18" fill="#415170">llama.cpp / Sherpa-ONNX</text>
    <text x="505" y="336" font-family="Inter,Arial,sans-serif" font-size="18" fill="#415170">TTS · ASR · OCR · FFI</text>
    <rect x="505" y="373" width="240" height="88" rx="18" fill="#edf2ff"/>
    <text x="526" y="408" font-family="Inter,Arial,sans-serif" font-size="17" fill="#3154c6">Models · Projects</text>
    <text x="526" y="438" font-family="Inter,Arial,sans-serif" font-size="17" fill="#3154c6">Logs · Cache · Exports</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="870" y="160" width="260" height="350" rx="28" fill="white"/>
    <text x="905" y="220" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#17203b">Optional network</text>
    <text x="905" y="270" font-family="Inter,Arial,sans-serif" font-size="18" fill="#415170">User-configured APIs</text>
    <text x="905" y="304" font-family="Inter,Arial,sans-serif" font-size="18" fill="#415170">ModelScope downloads</text>
    <text x="905" y="338" font-family="Inter,Arial,sans-serif" font-size="18" fill="#415170">MCP catalog / GitHub</text>
    <rect x="905" y="380" width="190" height="78" rx="18" fill="#fff4dd"/>
    <text x="926" y="414" font-family="Inter,Arial,sans-serif" font-size="17" fill="#9a6819">Explicit only</text>
    <text x="926" y="442" font-family="Inter,Arial,sans-serif" font-size="17" fill="#9a6819">No hidden endpoints</text>
  </g>
  <path d="M380 335H460" stroke="#6b7ca8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M780 335H860" stroke="#6b7ca8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="390" y="318" font-family="Inter,Arial,sans-serif" font-size="15" fill="#6b7ca8">local calls</text>
  <text x="788" y="318" font-family="Inter,Arial,sans-serif" font-size="15" fill="#6b7ca8">opt-in network</text>
</svg>
