<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">SIQI workflow overview</title>
  <desc id="desc">A five-step workflow from selecting a model to reviewing local logs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f0f4ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#233660" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7890bc"/></marker>
  </defs>
  <rect width="1200" height="500" rx="30" fill="url(#bg)"/>
  <text x="62" y="68" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" fill="#17203b">From prompt to local result</text>
  <text x="62" y="101" font-family="Inter,Arial,sans-serif" font-size="18" fill="#5e6c8d">A predictable flow for models, tools, files and diagnostics.</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g filter="url(#shadow)"><rect x="55" y="175" width="190" height="170" rx="24" fill="#315efb"/><circle cx="150" cy="225" r="27" fill="#fff" fill-opacity=".18"/><text x="150" y="234" font-size="26" font-weight="700" fill="white">1</text><text x="150" y="281" font-size="20" font-weight="700" fill="white">Choose</text><text x="150" y="312" font-size="16" fill="#e9edff">model + mode</text></g>
    <g filter="url(#shadow)"><rect x="285" y="175" width="190" height="170" rx="24" fill="#5b55e8"/><circle cx="380" cy="225" r="27" fill="#fff" fill-opacity=".18"/><text x="380" y="234" font-size="26" font-weight="700" fill="white">2</text><text x="380" y="281" font-size="20" font-weight="700" fill="white">Attach</text><text x="380" y="312" font-size="16" fill="#e9edff">files or voice</text></g>
    <g filter="url(#shadow)"><rect x="515" y="175" width="190" height="170" rx="24" fill="#784fd4"/><circle cx="610" cy="225" r="27" fill="#fff" fill-opacity=".18"/><text x="610" y="234" font-size="26" font-weight="700" fill="white">3</text><text x="610" y="281" font-size="20" font-weight="700" fill="white">Run</text><text x="610" y="312" font-size="16" fill="#e9edff">local or API</text></g>
    <g filter="url(#shadow)"><rect x="745" y="175" width="190" height="170" rx="24" fill="#ad4bc2"/><circle cx="840" cy="225" r="27" fill="#fff" fill-opacity=".18"/><text x="840" y="234" font-size="26" font-weight="700" fill="white">4</text><text x="840" y="281" font-size="20" font-weight="700" fill="white">Review</text><text x="840" y="312" font-size="16" fill="#ffeafd">approve actions</text></g>
    <g filter="url(#shadow)"><rect x="975" y="175" width="170" height="170" rx="24" fill="#d05b87"/><circle cx="1060" cy="225" r="27" fill="#fff" fill-opacity=".18"/><text x="1060" y="234" font-size="26" font-weight="700" fill="white">5</text><text x="1060" y="281" font-size="20" font-weight="700" fill="white">Keep</text><text x="1060" y="312" font-size="16" fill="#ffeaf1">logs locally</text></g>
  </g>
  <path d="M245 260H275M475 260H505M705 260H735M935 260H965" stroke="#7890bc" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="62" y="405" width="1076" height="42" rx="21" fill="#e4ebff"/>
  <text x="600" y="432" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#3154c6">Every network request is explicit · every sensitive action is reviewable · local data remains yours</text>
</svg>
